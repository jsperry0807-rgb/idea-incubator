<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding & viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary SEO -->
    <title>Idea Incubator</title>
    <meta name="title" content="Idea Incubator" />
    <meta
      name="description"
      content="A concise, compelling 150-160 character description of your app for search engines."
    />
    <meta name="author" content="Your Name or Company" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:title" content="Your App Name | Brand Name" />
    <meta
      property="og:description"
      content="A concise, compelling description for social sharing."
    />
    <meta property="og:image" content="https://www.example.com/og-image.jpg" />
    <meta property="og:site_name" content="Brand Name" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.example.com/" />
    <meta name="twitter:title" content="Your App Name | Brand Name" />
    <meta
      name="twitter:description"
      content="A concise, compelling description for social sharing."
    />
    <meta name="twitter:image" content="https://www.example.com/og-image.jpg" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Typography: Plus Jakarta Sans (300-700) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />

    <!-- Apply persisted theme before first paint (prevents theme flash) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("app.theme");
          var root = document.documentElement;
          var isDark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.dataset.theme = isDark ? "dark" : "light";
          root.classList.toggle("dark", isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#0b1211" : "#f4faf8");
        } catch (err) {
          /* storage unavailable — fall back to system theme */
        }
      })();
    </script>

    <!-- Minimal critical CSS: prevents FOUC / layout shift before bundle loads -->
    <style>
      :root {
        color-scheme: light;
        --color-bg: #f4faf8;
        --color-fg: #173b35;
        --color-card: #ffffff;
        --color-card-fg: #173b35;
        --color-muted: #5b6b68;
        --color-border: #dce8e4;
        --color-accent: #0f766e;
        --color-accent-fg: #ffffff;
        --color-accent-hover: #0d9488;
        --color-danger: #dc2626;
        --color-danger-fg: #ffffff;
        --color-success: #059669;
        --color-warning: #d97706;
        --color-info: #0284c7;
        --color-ring: #0f766e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --color-bg: #0b1211;
          --color-fg: #e7f1ee;
          --color-card: #131c1a;
          --color-card-fg: #e7f1ee;
          --color-muted: #9fb4ae;
          --color-border: #24312e;
          --color-accent: #2dd4bf;
          --color-accent-fg: #042f2e;
          --color-accent-hover: #5eead4;
          --color-danger: #f87171;
          --color-danger-fg: #1c0505;
          --color-success: #34d399;
          --color-warning: #fbbf24;
          --color-info: #38bdf8;
          --color-ring: #2dd4bf;
        }
      }
      :root[data-theme="dark"],
      :root.dark {
        color-scheme: dark;
        --color-bg: #0b1211;
        --color-fg: #e7f1ee;
        --color-card: #131c1a;
        --color-card-fg: #e7f1ee;
        --color-muted: #9fb4ae;
        --color-border: #24312e;
        --color-accent: #2dd4bf;
        --color-accent-fg: #042f2e;
        --color-accent-hover: #5eead4;
        --color-danger: #f87171;
        --color-danger-fg: #1c0505;
        --color-success: #34d399;
        --color-warning: #fbbf24;
        --color-info: #38bdf8;
        --color-ring: #2dd4bf;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: var(--color-bg);
        color: var(--color-fg);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- No-JS fallback: React apps render nothing without JS -->
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this app.</p>
      </div>
    </noscript>

    <!-- React mount point -->
    <div id="root"></div>

    <!--
    Vite entry point. If using Create React App or another bundler,
    replace this with your build tool's expected entry (e.g. /src/index.js
    with type="text/javascript", or leave to CRA's own generated index.html).
  -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
