<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Incubator — Auth</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .auth-card { position: relative; }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">theme</button>

  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">💡</div>
        <div class="auth-logo-text">Idea Incubator</div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab(this, 'login')">Log In</button>
        <button class="auth-tab" onclick="switchTab(this, 'register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="••••••••">
        </div>
        <button type="button" class="btn btn-primary" style="width:100%; justify-content:center; padding: 12px;">
          Log In
        </button>

        <div class="auth-divider">or</div>

        <div class="auth-oauth">
          <button type="button" class="btn btn-secondary" style="width:100%; justify-content:center;">
            Continue with GitHub
          </button>
          <button type="button" class="btn btn-secondary" style="width:100%; justify-content:center;">
            Continue with Google
          </button>
        </div>

        <div class="auth-footer">
          Don't have an account? <a href="#" onclick="switchTab(document.querySelector('.auth-tab:nth-child(2)'), 'register')">Sign up</a>
        </div>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" class="form-input" placeholder="Your name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="••••••••">
          <div class="form-hint">At least 8 characters</div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-input" placeholder="••••••••">
        </div>
        <button type="button" class="btn btn-primary" style="width:100%; justify-content:center; padding: 12px;">
          Create Account
        </button>

        <div class="auth-footer">
          Already have an account? <a href="#" onclick="switchTab(document.querySelector('.auth-tab:nth-child(1)'), 'login')">Log in</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
    }
    function switchTab(tab, form) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('login-form').style.display = form === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = form === 'register' ? 'block' : 'none';
    }
  </script>
</body>
</html>
